<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ff69ad">
<title>رسالة حلوة 💗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{overflow-x:hidden;background:linear-gradient(135deg,#ffd8ec,#d9e8ff 48%,#f4d9ff);color:#633c67}
.sky{position:fixed;inset:0;z-index:-5;overflow:hidden;background:radial-gradient(circle at 20% 20%,#fff 0 2%,transparent 14%),linear-gradient(135deg,#ffc5e1,#cfe2ff 50%,#efd2ff)}
.cloud{position:absolute;width:180px;height:65px;background:#fff8ffb8;border-radius:60px;filter:blur(1px);animation:drift 22s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff8ff;border-radius:50%}.cloud:before{width:75px;height:75px;right:30px;top:-35px}.cloud:after{width:55px;height:55px;left:30px;top:-20px}
.c1{top:10%;left:-200px}.c2{top:54%;left:-250px;animation-duration:30s;animation-delay:-9s;transform:scale(.75)}
@keyframes drift{to{transform:translateX(125vw)}} 
.float{position:absolute;animation:float 5s ease-in-out infinite;user-select:none}
.teddy{font-size:65px}.bird{font-size:42px}.gift{font-size:52px}
@keyframes float{50%{transform:translateY(-24px) rotate(4deg)}}
.decor{position:fixed;inset:0;z-index:-2;pointer-events:none}
.spark{position:absolute;animation:fall linear infinite;opacity:.75}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(115vh) rotate(360deg)}}
.wrap{width:min(680px,92vw);margin:auto;padding:28px 0 55px}
.card{background:#ffffffc9;backdrop-filter:blur(16px);border:2px solid #fff8;border-radius:30px;box-shadow:0 20px 60px #9e5b9c2b;padding:25px}
.logo{text-align:center;font-size:48px}.title{text-align:center;font-size:30px;margin:4px 0 8px;color:#ec4d9a;font-weight:900}
.sub{text-align:center;line-height:1.8;color:#765b7b}
label{display:block;margin:15px 0 7px;font-weight:800}
input,select{width:100%;border:2px solid #f1b8d8;background:#fff9;border-radius:17px;padding:14px 16px;font-size:16px;outline:none;color:#633c67}
input:focus,select:focus{border-color:#ee63a8;box-shadow:0 0 0 4px #ff8fc833}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:18px;padding:15px 20px;font-size:17px;font-weight:900;cursor:pointer;color:white;background:linear-gradient(135deg,#ff4f9e,#a974f5);box-shadow:0 9px 22px #db62a44a}
button:active{transform:scale(.98)}.wide{width:100%;margin-top:20px}
.hidden{display:none!important}
.choice{display:flex;gap:10px}.choice button{flex:1}.choice button.alt{background:linear-gradient(135deg,#7baef8,#8c7be8)}
.linkbox{margin-top:18px;background:#fff9;border-radius:18px;padding:12px;word-break:break-all;font-size:13px}
.copy{margin-top:10px;background:#8f78e9}
.small{text-align:center;font-size:13px;opacity:.8;margin-top:12px}
#reveal{text-align:center}.present{font-size:100px;animation:bounce 1.5s infinite;cursor:pointer}
@keyframes bounce{50%{transform:translateY(-12px) rotate(3deg)}}
.message{background:#fff9;border-radius:24px;padding:22px;margin-top:15px;font-size:23px;line-height:1.9;font-weight:800;color:#704067}
.from{margin-top:15px;font-weight:900;color:#ec4d9a}
.shine{font-size:35px}
@media(max-width:520px){.row{grid-template-columns:1fr}.card{padding:20px}.title{font-size:27px}}
</style>
</head>
<body>
<div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div></div>
<div class="decor" id="decor"></div>
<div class="float teddy" style="top:7%;right:4%">🧸</div>
<div class="float teddy" style="top:72%;left:2%;animation-delay:-2s">🧸</div>
<div class="float bird" style="top:20%;left:7%;animation-delay:-1s">🕊️</div>
<div class="float bird" style="top:43%;right:6%;animation-delay:-3s">🐦</div>
<div class="float gift" style="top:82%;right:9%;animation-delay:-4s">🎁</div>
<div class="wrap">
<section class="card" id="creator">
  <div class="logo">💗🧸🕊️</div>
  <div class="title">رسالة حلوة</div>
  <div class="sub">ابعت كلمة حلوة لشخص بتحبه أو صاحبك وخليه يفتح مفاجأة صغيرة 🎁</div>
  <label>اسمك 💕</label>
  <input id="sender" placeholder="اكتب اسمك هنا">
  <label>اسم الشخص اللي هتبعتله</label>
  <input id="receiver" placeholder="اكتب اسمه هنا">
  <label>الشخص ده...</label>
  <div class="choice">
    <button type="button" id="girl">🎀 بنت</button>
    <button type="button" class="alt" id="boy">💙 ولد</button>
  </div>
  <button class="wide" id="make">🎁 اختارلي رسالة واعمل الرابط</button>
  <div id="result" class="hidden">
    <div class="linkbox" id="link"></div>
    <button class="wide copy" id="copy">📋 نسخ الرابط</button>
    <div class="small">كل مرة تعمل رابط جديد، الموقع يختار جملة جديدة ✨<br>نفس الرابط يفضل يحمل نفس الرسالة.</div>
  </div>
</section>

<section class="card hidden" id="reveal">
  <div class="shine">✨💗✨</div>
  <h1 id="hello"></h1>
  <div class="sub">في حد بعتلك حاجة حلوة جدًا...</div>
  <div class="present" id="present">🎁</div>
  <button class="wide" id="openGift">افتح المفاجأة 💝</button>
  <div id="msg" class="hidden">
    <div class="message" id="text"></div>
    <div class="from" id="from"></div>
    <div style="font-size:34px;margin-top:15px">🧸 🕊️ 🎀 🎁 💗</div>
  </div>
</section>
</div>
<script>
const girls=[
"وجودك في الدنيا لوحده بيخليها ألطف وأجمل 💗",
"إنتِ من الناس اللي مجرد وجودهم بيخلّي اليوم أحلى 🌷",
"أتمنى دايمًا تفضلي شايفة قد إيه إنتِ مميزة وجميلة من جواكي 💕",
"ضحكتك كفاية تغيّر مود يوم كامل 🎀",
"إنتِ تستحقي كل حاجة حلوة تيجي في طريقك ✨",
"خليكي دايمًا فخورة بنفسك، لأنك تستحقي ده فعلًا 💗",
"فيكي حاجة لطيفة بتخلّي وجودك مختلف عن أي حد 🌸",
"أتمنى أيامك الجاية تكون أجمل من كل اللي فات 🦋",
"إنتِ شخص يستاهل يتقاله كلام حلو كل يوم 💝",
"وجودك بيضيف للحياة لون أحلى 🌈",
"ممكن متعرفيش، بس وجودك بيفرق مع ناس كتير جدًا 💕",
"أتمنى قلبك يفضل دايمًا مليان راحة وفرحة 🌷",
"إنتِ أجمل لما تكوني على طبيعتك، متنسيش ده أبدًا 🩷",
"ربنا يرزقك أيامًا تشبه جمال قلبك ✨",
"كل حاجة حلوة تليق بيكي، من غير استثناء 🎀",
"أتمنى تلاقي دايمًا سبب يخليكي تبتسمي 💗",
"إنتِ تستحقي كلمة حلوة، ودي واحدة منها: إنتِ مميزة جدًا 🌸",
"خليكي متأكدة إن ليكي مكان جميل في قلوب ناس كتير 🕊️",
"أتمنى كل أمنية حلوة في قلبك تلاقي طريقها ليكي 💝",
"إنتِ واحدة من الحاجات اللطيفة اللي الدنيا محظوظة بوجودها 🌷",
"مفيش أحلى من شخص حقيقي ولطيف زيك 💕",
"أتمنى الدنيا تكون رقيقة معاكي على قد ما قلبك رقيق ✨",
"لو اليوم كان صعب، افتكري إن بكرة ممكن يكون أجمل بكتير 🦋",
"إنتِ تستحقي الفرح من غير سبب، والضحكة من غير مناسبة 💗",
"ربنا يحفظ قلبك من أي حاجة تضايقه ويملأه فرحة 🌸"
];
const boys=[
"وجودك في حياة اللي حواليك بيفرق أكتر مما تتخيل 💙",
"إنت شخص يستاهل كل كلمة حلوة تتقال عنه ✨",
"أتمنى أيامك الجاية تكون مليانة نجاح وفرحة وراحة بال 💙",
"خليك دايمًا فخور بنفسك وباللي بتعمله، إنت تستاهل 👏",
"فيك حاجة مميزة بتخلي وجودك مختلف عن أي حد 🌟",
"أتمنى كل خطوة جاية في حياتك تقربك من اللي نفسك فيه 💙",
"وجودك بيخلّي الدنيا ألطف بكتير مما تتخيل 🕊️",
"مهما كان يومك، افتكر إنك قادر تعدّي أي حاجة وتكمل ✨",
"إنت من الناس اللي تستحق تسمع كلام حلو أكتر 💙",
"أتمنى النجاح يفضل ماشي معاك في كل خطوة 🌟",
"خليك زي ما إنت، لأن شخصيتك الحقيقية هي أحلى حاجة فيك 💙",
"أتمنى تلاقي دايمًا ناس تقدر قيمتك بجد 🫶",
"إنت تستحق أيامًا جميلة تليق بتعبك ومجهودك ✨",
"ربنا يوفقك في كل حاجة نفسك تحققها 💙",
"في ناس وجودها بيعمل فرق، وإنت واحد منهم 🌟",
"أتمنى كل حلم عندك يتحول يومًا لحقيقة 💙",
"افتكر دايمًا إنك أقوى وأقدر مما تتخيل 💪",
"أتمنى كل اللي جاي يكون أهدى وأجمل ليك 🕊️",
"وجودك له قيمة، حتى في الأيام اللي مش حاسس فيها بده 💙",
"ربنا يكتبلك فرحة كبيرة على قد قلبك ✨",
"إنت تستحق إنك تفتخر بنفسك وبطريقك 🌟",
"أتمنى الدنيا تديك على قد تعبك وأكثر 💙",
"خليك مكمل، يمكن أجمل حاجة في حياتك لسه جاية 🎁",
"كل نجاح صغير بتعمله يستحق إنك تفرح بيه 👏",
"أتمنى السنة الجاية تكون بداية لحاجات عظيمة في حياتك 💙"
];
let gender="girl";
girl.onclick=()=>{gender="girl";girl.style.outline="4px solid #ff9aca";boy.style.outline="none"};
boy.onclick=()=>{gender="boy";boy.style.outline="4px solid #a9baff";girl.style.outline="none"};
function enc(x){return btoa(unescape(encodeURIComponent(x)));}
function dec(x){return decodeURIComponent(escape(atob(x)));}
function build(){
 const s=sender.value.trim(), r=receiver.value.trim();
 if(!s||!r){alert("اكتب اسمك واسم الشخص الأول 💗");return}
 const arr=gender==="girl"?girls:boys;
 const phrase=arr[Math.floor(Math.random()*arr.length)];
 const data=enc(JSON.stringify({s,r,g:gender,p:phrase}));
 const url=location.href.split("#")[0]+"#m="+data;
 link.textContent=url; result.classList.remove("hidden");
 history.replaceState(null,"", "#m="+data);
}
make.onclick=build;
copy.onclick=async()=>{try{await navigator.clipboard.writeText(link.textContent);copy.textContent="✅ اتنسخ الرابط";setTimeout(()=>copy.textContent="📋 نسخ الرابط",1800)}catch(e){prompt("انسخ الرابط:",link.textContent)}};
function openMessage(){
 const raw=location.hash.startsWith("#m=")?location.hash.slice(3):null;
 if(!raw)return;
 try{
  const d=JSON.parse(dec(raw)); creator.classList.add("hidden"); reveal.classList.remove("hidden");
  hello.textContent=`يا ${d.r} 💗`;
  text.textContent=d.p;
  from.textContent=`من ${d.s} 🕊️`;
 }catch(e){}
}
openGift.onclick=()=>{msg.classList.remove("hidden");present.style.display="none";openGift.style.display="none"};
present.onclick=()=>openGift.click();
const icons=["🩷","💗","🎀","✨","🌸","🦋","🕊️","💜"];
for(let i=0;i<45;i++){const e=document.createElement("span");e.className="spark";e.textContent=icons[Math.floor(Math.random()*icons.length)];e.style.left=Math.random()*100+"%";e.style.top=Math.random()*100+"%";e.style.fontSize=(12+Math.random()*18)+"px";e.style.animationDuration=(7+Math.random()*12)+"s";e.style.animationDelay=(-Math.random()*15)+"s";decor.appendChild(e)}
openMessage();
</script>
</body>
</html>
